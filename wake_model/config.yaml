# Настройки проекта собственной wake-модели openWakeWord.
#
# Piper и голоса лежат в ASCII-каталоге за пределами репозитория:
# piper.exe (2023.11.14-2) падает на путях с кириллицей, а путь проекта
# содержит «Проект по умолчанию». Пути можно переопределить переменными
# окружения PIPER_EXE и PIPER_VOICES.

phrase: "хей луна"

paths:
  piper: "%USERPROFILE%/Documents/VoiceAssistantTools/piper/piper.exe"
  voices: "%USERPROFILE%/Documents/VoiceAssistantTools/voices"
  data: "data"
  features: "features"
  checkpoints: "checkpoints"

audio:
  sample_rate: 16000
  channels: 1
  sample_width: 2

voices:
  # denis и dmitri не прошли QC: первое слово звучит как «кей/цей».
  # ruslan отбракован на контрольном прослушивании.
  - ru_RU-irina-medium

# Основной синтез для обучения. Silero v5 даёт 5 голосов и SSML-управление
# темпом/паузами; Supertonic 3 — современные голоса и параметр speed;
# Piper остаётся дополнительным источником одного голоса.
# Silero CIS пока кандидат: решение после прослушивания.
silero:
  model: v5_ru
  # kseniya не прошла прослушивание: «кей» во всех темпах.
  # Остальные четыре голоса проверены на слух — годятся.
  voices:
    - aidar
    - baya
    - eugene
    - xenia
  # fast отбракован после массового QC: на 1,18–1,22 модель часто
  # проглатывает «лу»; на 1,12–1,16 aidar/baya чистые, eugene/xenia нет.
  # Скорость добавим аугментациями на этапе 4.
  variants:
    - plain
    - slow
    - break
  break_ms: [150, 400]
  # Небольшой разброс темпа и тона на каждом клипе: Silero детерминирован,
  # без этого получаются одинаковые волны.
  rate:
    plain: [0.94, 1.06]
    slow: [0.78, 0.82]
    break: [0.94, 1.06]
  pitch: [-0.02, 0.02]
  # Сетка для добора уникальных волн: Silero квантует темп до 5 %,
  # питч — до 1 %, а break_ms даёт новую волну на каждое значение.
  grid:
    variants: [plain, slow, break]
    rate:
      plain: [0.90, 0.95, 1.00, 1.05, 1.10]
      slow: [0.80]
      break: [0.90, 0.95, 1.00, 1.05, 1.10]
    pitch: [-0.03, -0.02, -0.01, 0.0, 0.01, 0.02, 0.03]
    break_ms: [100, 150, 200, 250, 300, 350, 400, 450, 500]
    target: 95

supertonic:
  model: supertonic-3
  # M1 и M2 не прошли контрольную проверку; M5 — все темпы.
  voices:
    - M5
  variants:
    - plain
    - slow
    - fast
  speed:
    plain: [0.98, 1.02]
    slow: [0.90, 0.95]
    fast: [1.05, 1.10]
  total_steps: 8

# Дополнительные русские голоса Silero из модели СНГ. Все проверены на слух.
# Не прошли прослушивание: bogdan, dmitriy, igor, karina, safarhuja, miyau,
# а также albina, eduard, alfia2, onaoy, ramilia, gamat, sibday, kseniya.
silero_cis:
  model: v5_cis_base
  voices:
    - ru_marat
    - ru_nurgul
    - ru_oksana
    - ru_vika
    - ru_aigul
    - ru_alfia
    - ru_roman
    - ru_zhadyra
    - ru_alexandr
    - ru_ekaterina
    - ru_kejilgan
    - ru_kermen
    - ru_saida
    - ru_zara
    - ru_zhazira
    - ru_zinaida
  variants:
    - plain
    - slow
  rate:
    plain: [0.94, 1.06]
    slow: [0.78, 0.82]
  pitch: [-0.02, 0.02]
  grid:
    variants: [plain, slow, break]
    rate:
      plain: [0.90, 0.95, 1.00, 1.05, 1.10]
      slow: [0.80]
      break: [0.90, 0.95, 1.00, 1.05, 1.10]
    pitch: [-0.03, -0.02, -0.01, 0.0, 0.01, 0.02, 0.03]
    break_ms: [100, 150, 200, 250, 300, 350, 400, 450, 500]
    target: 110

# Диапазоны для этапа 0 и синтетических позитивов этапа 1.
synthesis:
  # Piper ломает «хей» при изменении темпа, поэтому только около 1.0.
  length_scale: [0.98, 1.02]
  noise_scale: [0.5, 0.8]
  noise_w: [0.6, 1.0]
  pause_probability: 0.25      # доля клипов «хей, луна» с паузой
  lead_silence: 0.30
  tail_silence: 0.30
  target_peak_db: -3.0
  trim_threshold_db: -40.0
  trim_padding: 0.03
