# Настройки проекта собственной wake-модели openWakeWord.
#
# Инструменты Piper (архив, в датасете не используются) лежат в
# untracked-папке VoiceAssistantTools в корне проекта; пути ниже
# относительны корня проекта. piper.exe (2023.11.14-2) падает на
# кириллических путях, поэтому корень проекта должен оставаться ASCII.
# Пути можно переопределить PIPER_EXE и PIPER_VOICES.

phrase: "хей луна"

paths:
  piper: "VoiceAssistantTools/piper/piper.exe"
  voices: "VoiceAssistantTools/voices"
  data: "data"
  features: "features"
  checkpoints: "checkpoints"

audio:
  sample_rate: 16000
  channels: 1
  sample_width: 2

# Piper исключён полностью: irina не прошла контроль качества.
# denis и dmitri не прошли QC («кей/цей»), ruslan — прослушивание.
voices: []

# Основной синтез для обучения. Silero v5 даёт SSML-управление
# темпом/паузами; Supertonic 3 — современные голоса и параметр speed.
# Piper исключён полностью; его настройки ниже оставлены для истории.
silero:
  model: v5_ru
  # kseniya не прошла прослушивание: «кей» во всех темпах.
  # Остальные четыре голоса проверены на слух — годятся.
  voices:
    - aidar
    - baya
    - eugene
    - xenia
  # fast отбракован после массового QC: на 1,18–1,22 модель часто
  # проглатывает «лу»; на 1,12–1,16 aidar/baya чистые, eugene/xenia нет.
  # Скорость добавим аугментациями на этапе 4.
  variants:
    - plain
    - slow
    - break
  break_ms: [150, 400]
  # Небольшой разброс темпа и тона на каждом клипе: Silero детерминирован,
  # без этого получаются одинаковые волны.
  rate:
    plain: [0.94, 1.06]
    slow: [0.78, 0.82]
    break: [0.94, 1.06]
  pitch: [-0.02, 0.02]
  # Сетка для добора уникальных волн: Silero квантует темп до 5 %,
  # питч — до 1 %, а break_ms даёт новую волну на каждое значение.
  grid:
    variants: [plain, slow, break]
    rate:
      plain: [0.90, 0.95, 1.00, 1.05, 1.10]
      slow: [0.80]
      break: [0.90, 0.95, 1.00, 1.05, 1.10]
    pitch: [-0.03, -0.02, -0.01, 0.0, 0.01, 0.02, 0.03]
    break_ms: [100, 150, 200, 250, 300, 350, 400, 450, 500]
    target: 95

supertonic:
  model: supertonic-3
  # M1 и M2 не прошли контрольную проверку; M5 — все темпы.
  voices:
    - M5
  variants:
    - plain
    - slow
    - fast
  speed:
    plain: [0.98, 1.02]
    slow: [0.90, 0.95]
    fast: [1.05, 1.10]
  total_steps: 8

# Дополнительные русские голоса Silero из модели СНГ. Все проверены на слух.
# Не прошли прослушивание: bogdan, dmitriy, igor, karina, kejilgan,
# safarhuja, miyau, а также albina, eduard, alfia2, onaoy, ramilia,
# gamat, sibday, kseniya.
silero_cis:
  model: v5_cis_base
  voices:
    - ru_marat
    - ru_nurgul
    - ru_oksana
    - ru_vika
    - ru_aigul
    - ru_alfia
    - ru_roman
    - ru_zhadyra
    - ru_alexandr
    - ru_ekaterina
    - ru_kermen
    - ru_saida
    - ru_zara
    - ru_zhazira
    - ru_zinaida
  variants:
    - plain
    - slow
  rate:
    plain: [0.94, 1.06]
    slow: [0.78, 0.82]
  pitch: [-0.02, 0.02]
  grid:
    variants: [plain, slow, break]
    rate:
      plain: [0.90, 0.95, 1.00, 1.05, 1.10]
      slow: [0.80]
      break: [0.90, 0.95, 1.00, 1.05, 1.10]
    pitch: [-0.03, -0.02, -0.01, 0.0, 0.01, 0.02, 0.03]
    break_ms: [100, 150, 200, 250, 300, 350, 400, 450, 500]
    target: 110

# Этап 2: запись реальных позитивов (wake_model/scripts/record_positives.py).
# Матрица: дистанция × фон × уровень голоса; фон — внешний блок сессии.
recording:
  phrase: "хей луна"
  extra_phrase: "эй луна"       # опциональный блок для решения на этапе 7
  extra_takes: 2
  window_s: 3.0                # фиксированное окно записи
  countdown_s: 2.0             # отсчёт перед маркером старта
  calibration_s: 5.0           # фон для noise floor
  takes_per_cell: 3            # 2–3 по ТЗ
  distances_m: [0.5, 1.0, 1.5, 2.0]
  conditions: [quiet, music, tv]
  levels: [norm, sub]
  trim_threshold_db: -40.0     # как у синтетики: порог относительно пика
  trim_padding: 0.03
  lead_silence: 0.30
  tail_silence: 0.30
  min_speech_s: 0.70
  max_speech_s: 2.50
  target_min: 60               # дублей на диктора × микрофон
  target_max: 100

# Диапазоны для этапа 0 и синтетических позитивов этапа 1.
synthesis:
  # Исторические параметры Piper; в текущем датасете не используются.
  length_scale: [0.98, 1.02]
  noise_scale: [0.5, 0.8]
  noise_w: [0.6, 1.0]
  pause_probability: 0.25      # доля клипов «хей, луна» с паузой
  lead_silence: 0.30
  tail_silence: 0.30
  target_peak_db: -3.0
  trim_threshold_db: -40.0
  trim_padding: 0.03
