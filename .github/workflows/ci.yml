name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Имена job'ов (lint, tests) — это и есть имена проверок в GitHub.
# Правило защиты main требует именно их: переименование заблокирует все PR.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установить ruff
        run: pip install "ruff==0.17.4"
      - name: ruff check
        run: ruff check app tests
      - name: ruff format --check
        run: ruff format --check app tests

  tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Установить зависимости
        run: pip install -r requirements.lock
      - name: Установить coverage
        run: pip install "coverage==7.17.3"
      - name: unittest
        env:
          PYTHONUTF8: "1"
        run: python -m coverage run -m unittest discover -s tests
      - name: Покрытие
        if: always()
        shell: pwsh
        run: |
          $report = coverage report --show-missing
          $report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          coverage html -d coverage_html
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          coverage xml -o coverage.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          '### Покрытие (без порога)' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $report | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Сохранить отчёт о покрытии
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            coverage_html/
          if-no-files-found: warn
          retention-days: 14